<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>CTM - Cell to Mind</title>
    <!--
      Favicon gömülü SVG: istek başına dosya okunmaz, `/favicon.ico` 404'ü de
      (tarayıcı konsolunda görülen tek hata) ortadan kalkar. Üç hücreli bir
      koloni: projeyle aynı görsel dili.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Ccircle cx='16' cy='11' r='4.5' fill='%2338bdf8'/%3E%3Ccircle cx='10' cy='21' r='4' fill='%2322d3ee'/%3E%3Ccircle cx='22' cy='21' r='4' fill='%2322d3ee'/%3E%3Cpath d='M16 15.5 10 17M16 15.5 22 17M14 21.5h4' stroke='%237dd3fc' stroke-width='1.6' fill='none' opacity='.85'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Cell to Mind — Tek hücreden öğrenen yaşama. Tarayıcıda çalışan 3B bilimsel ekosistem simülasyonu: çok hücrelilik, evrim, gerçek yapay sinir ağları ve kanıtlı gözlemci."
    />
    <style>
      /* Kritik kabuk stilleri: React yüklenmeden önce derin su rengi görünür. */
      :root {
        --deep: #071b22;
        --panel: #102b33;
        --text: #e9f0df;
        --life: #a8d672;
        --resource: #f2ba72;
        --damage: #e58d81;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--deep);
        color: var(--text);
        overflow: hidden;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 0.75rem;
        align-content: center;
        text-align: center;
        padding: 2rem;
        z-index: 50;
      }
      #boot h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      #boot p {
        margin: 0;
        font-size: 0.82rem;
        opacity: 0.72;
        max-width: 34ch;
        line-height: 1.5;
      }
      .boot-bar {
        width: min(220px, 60vw);
        height: 2px;
        background: rgba(233, 240, 223, 0.18);
        overflow: hidden;
        border-radius: 2px;
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: var(--life);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after {
          animation: none;
          width: 100%;
          transform: none;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <h1>Cell to Mind</h1>
      <div class="boot-bar" aria-hidden="true"></div>
      <p>Yaşam döngüsü başlatılıyor…</p>
    </div>
    <noscript>
      <p style="padding: 2rem">
        Cell to Mind çalışmak için JavaScript ve WebGL2 gerektirir. Lütfen JavaScript'i etkinleştirin.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
